name = "aso-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Secrets (set with `wrangler secret put <NAME>`, do NOT put real values here):
#   TELEGRAM_BOT_TOKEN   - token from @BotFather
#   ANTHROPIC_API_KEY    - Claude API key (https://console.anthropic.com)
#   WEBHOOK_SECRET       - random string you choose, used to verify Telegram calls

[vars]
# ADMIN_CHAT_ID = "your Telegram chat id" — only this chat can use /stats.
# Get your chat id by messaging @userinfobot on Telegram.

# KV storage for /stats (unique users + recent errors). Create it once with:
#   wrangler kv namespace create ASO_BOT_KV
# then paste the printed id below.
# [[kv_namespaces]]
# binding = "ASO_BOT_KV"
# id = "REPLACE_WITH_NAMESPACE_ID"
