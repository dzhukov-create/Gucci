name = "aso-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Secrets (set with `wrangler secret put <NAME>`, do NOT put real values here):
#   TELEGRAM_BOT_TOKEN   - token from @BotFather
#   ANTHROPIC_API_KEY    - Claude API key (https://console.anthropic.com)
#   WEBHOOK_SECRET       - random string you choose, used to verify Telegram calls

[vars]
# Non-secret config can go here, e.g.:
# ASO_BOT_NAME = "RadASO Bot"
